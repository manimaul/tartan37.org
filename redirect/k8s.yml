apiVersion: v1
kind: Namespace
metadata:
  name: t37
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: t37-redirect-conf
  namespace: t37
data:
  nginx.conf: |
    worker_processes auto;

    events {
        worker_connections 1024;
    }

    http {
        server {
            listen 8080;
            server_name _;

            location / {
                return 302 https://tartan37.net$request_uri;
            }
        }
    }
---
apiVersion: v1
kind: Service
metadata:
  name: t37-web-svc
  namespace: t37
spec:
  ports:
    - name: http
      port: 8080
      targetPort: 8080
  selector:
    app: t37-web-svc
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: t37-redirect-deb
  namespace: t37
spec:
  selector:
    matchLabels:
      app: t37-web-svc
  template:
    metadata:
      labels:
        app: t37-web-svc
    spec:
      volumes:
        - name: nginx-conf
          configMap:
            name: t37-redirect-conf
      containers:
        - image: nginx:alpine
          imagePullPolicy: Always
          name: t37-web-svc
          volumeMounts:
            - name: nginx-conf
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
          ports:
            - containerPort: 8080
              name: http
          resources:
            requests:
              cpu: 50m
---              
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: t37ingress
  namespace: t37
spec:
  ingressClassName: haproxy
  rules:
    - host: tartan37.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: t37-web-svc
                port:
                  number: 8080
  tls:
    - hosts:
        - tartan37.org
      secretName: t37-cert
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: t37-cert
  namespace: t37
spec:
  secretName: t37-cert
  commonName: tartan37.org
  dnsNames:
    - tartan37.org
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt-prod
